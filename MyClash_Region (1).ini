[custom]
;==============================================================================
;  Clash 订阅转换模板  ·  按地区自动测速 + 业务分流
;------------------------------------------------------------------------------
;  用法（subconverter）:
;    /sub?target=clash&insert=true&url=<你的订阅链接>&config=<本文件路径>
;  作用:
;    1. 按节点名称自动判断国家/地区 → 生成 香港 / 日本 / 美国 / 台湾 自动测速组
;    2. 沿用原 config.yaml 的业务分流组与规则（人工智能、流媒体、电报、谷歌…）
;  说明:
;    · 标 [原配置] 的地方与你的 config.yaml 一一对应
;    · 订阅里没有某个地区的节点时，对应分组会自动降级为 DIRECT（不会报错）
;==============================================================================

;------------------------------------------------------------------------------
; 一、地区自动测速组（url-test：自动选延迟最低的节点，定期重测）
;     正则匹配节点名称，大小写不敏感（(?i) 是 subconverter 支持的写法）
;------------------------------------------------------------------------------
custom_proxy_group=🇭🇰 香港自动`url-test`(?i)(港|HK|hk|Hk|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`180,3,50
custom_proxy_group=🇯🇵 日本自动`url-test`(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)`http://www.gstatic.com/generate_204`180,3,50
custom_proxy_group=🇺🇸 美国自动`url-test`(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.gstatic.com/generate_204`180,3,50
custom_proxy_group=🇨🇳 台湾自动`url-test`(?i)(台湾|台灣|Taiwan|TW[-_ 0-9]|TW$|新北|彰化)`http://www.gstatic.com/generate_204`180,3,50

;------------------------------------------------------------------------------
; 二、中转 / 特殊用途组
;------------------------------------------------------------------------------
; [原配置] 稳定组：依次故障转移（JP→HK→US→TW）
custom_proxy_group=♻️ 稳定组`fallback`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`http://www.gstatic.com/generate_204`120,3

; [原配置] 良心云流媒体自动 → 改为「名称含流媒体/解锁的节点」自动测速
custom_proxy_group=🎬 流媒体解锁`url-test`(?i)(流媒体|解锁|Netflix|Disney|HBO|NF)`http://www.gstatic.com/generate_204`180,3,50

; [原配置] Telegram机器人专用：优先日本，再香港、美国、流媒体节点
custom_proxy_group=📲 电报机器人专用`fallback`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🎬 流媒体解锁`http://www.gstatic.com/generate_204`120,3

; 想手动点选某个具体节点时用这个组（订阅里所有节点都会列进去）
custom_proxy_group=🚀 手动切换`select`.*

; [原配置] 主代理：顶部总开关，默认走稳定组
custom_proxy_group=🚀 主代理`select`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]🎬 流媒体解锁`[]📲 电报机器人专用`[]🚀 手动切换`[]DIRECT`[]REJECT

;------------------------------------------------------------------------------
; 三、业务分流组（名称与 config.yaml 的规则目标保持一致，不要改名）
;------------------------------------------------------------------------------
custom_proxy_group=人工智能`select`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🇭🇰 香港自动`[]🇨🇳 台湾自动`[]DIRECT`[]REJECT
custom_proxy_group=流媒体`select`[]🚀 主代理`[]♻️ 稳定组`[]🎬 流媒体解锁`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]DIRECT`[]REJECT
custom_proxy_group=电报机器人`select`[]📲 电报机器人专用`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]DIRECT`[]REJECT
custom_proxy_group=谷歌`select`[]🚀 主代理`[]♻️ 稳定组`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]DIRECT`[]REJECT
custom_proxy_group=微软`select`[]DIRECT`[]🚀 主代理`[]♻️ 稳定组`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]REJECT
custom_proxy_group=苹果`select`[]DIRECT`[]🚀 主代理`[]♻️ 稳定组`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]REJECT
custom_proxy_group=英伟达`select`[]🚀 主代理`[]♻️ 稳定组`[]🇺🇸 美国自动`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]DIRECT`[]REJECT
custom_proxy_group=游戏`select`[]DIRECT`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]REJECT
custom_proxy_group=加密货币`select`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]DIRECT`[]REJECT
custom_proxy_group=颜色`select`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]DIRECT`[]REJECT
custom_proxy_group=测试`select`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]DIRECT`[]REJECT
custom_proxy_group=国外`select`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]DIRECT`[]REJECT
custom_proxy_group=国内`select`[]DIRECT`[]🚀 主代理`[]♻️ 稳定组`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]REJECT
custom_proxy_group=其他`select`[]🚀 主代理`[]♻️ 稳定组`[]🇯🇵 日本自动`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇨🇳 台湾自动`[]DIRECT`[]REJECT

;------------------------------------------------------------------------------
; 四、规则（顺序 = 匹配优先级，与 config.yaml 的 rules 顺序一致）
;------------------------------------------------------------------------------

; ---- 0. 局域网 / 私有地址，最先匹配，永不代理 ----
ruleset=国内,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml

; ---- 1. 测试 / 成人 / GitHub [原配置: Test / Sex / GitHub] ----
ruleset=测试,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Check.list
ruleset=颜色,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Sex.list
ruleset=国外,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.yaml

; ---- 2. 人工智能：Claude / Copilot / Gemini / Groq / Grok / Meta AI / Perplexity / ChatGPT ----
ruleset=人工智能,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Claude.list
ruleset=人工智能,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Copilot.list
ruleset=人工智能,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Gemini.list
ruleset=人工智能,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/groq.yaml
ruleset=人工智能,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Grok.list
ruleset=人工智能,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/MetaAi.list
ruleset=人工智能,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/perplexity.yaml
ruleset=人工智能,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.yaml

; ---- 3. YouTube / Google / Microsoft / Apple ----
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.yaml
ruleset=谷歌,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.yaml
ruleset=谷歌,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.yaml
ruleset=微软,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.yaml
ruleset=苹果,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.yaml
ruleset=苹果,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.yaml
ruleset=苹果,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Apple.list

; ---- 4. 加密货币 [原配置: Crypto / OKX / Bybit / Binance] ----
ruleset=加密货币,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Crypto.list
ruleset=加密货币,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/okx.yaml
ruleset=加密货币,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bybit.yaml
ruleset=加密货币,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/binance.yaml

; ---- 5. 流媒体 [原配置: TikTok / Netflix / Disney / Amazon / HBO / Crunchyroll / Popcorn / Spotify] ----
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.yaml
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.yaml
ruleset=流媒体,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.yaml
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/disney.yaml
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/amazon.yaml
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/hbo.yaml
ruleset=流媒体,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Crunchyroll.list
ruleset=流媒体,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Popcorn.list
; [原配置] Spotify 走「谷歌」组
ruleset=谷歌,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/spotify.yaml

; ---- 6. 社交 [原配置: Twitter / WhatsApp / Facebook] ----
ruleset=国外,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/x.yaml
ruleset=国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Whatsapp/Whatsapp.list
ruleset=国外,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/facebook.yaml

; ---- 7. Telegram [原配置: Telegram / Domain + IP] ----
ruleset=电报机器人,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.yaml
ruleset=电报机器人,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.yaml

; ---- 8. 游戏 [原配置: Steam / Epic / EA / Blizzard / UBI / PlayStation / Nintendo] ----
ruleset=游戏,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.yaml
ruleset=游戏,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Epic/Epic.list
ruleset=游戏,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/EA/EA.list
ruleset=游戏,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Blizzard/Blizzard.list
ruleset=游戏,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/UBI/UBI.list
ruleset=游戏,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PlayStation/PlayStation.list
ruleset=游戏,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Nintendo/Nintendo.list
ruleset=英伟达,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Nvidia/Nvidia.list

; ---- 9. 常见国外站点（原配置 Proxy / Domain）----
ruleset=国外,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Proxy.list

; ---- 10. 自定义域名（原配置写在 Proxy 之后，优先级高于下面的 Globe）----
; AI 模型服务 → 人工智能组（opencode / kilo / workbuddy 等）
ruleset=人工智能,[]DOMAIN-SUFFIX,opencode.ai
ruleset=人工智能,[]DOMAIN-SUFFIX,dtyg123.dpdns.org
ruleset=人工智能,[]DOMAIN-SUFFIX,kilo.ai
ruleset=人工智能,[]DOMAIN-SUFFIX,workbuddy.ai
; 国内服务 → 直连（原配置写死 DIRECT，这里放进「国内」组，默认 DIRECT，可随时切走）
ruleset=国内,[]DOMAIN-SUFFIX,codebuddy.cn
ruleset=国内,[]DOMAIN-SUFFIX,sensenova.cn

; ---- 11. 国外兜底（原配置 Globe / Domain）----
ruleset=国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

; ---- 12. 国内 [原配置: Direct / China / China IP / Private] ----
ruleset=国内,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Direct.list
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.yaml
ruleset=国内,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.yaml

; ---- 13. 兜底：其他（原配置 MATCH,其他）----
ruleset=其他,[]FINAL

; 覆盖 base 配置里自带的旧规则，只用上面这份
overwrite_original_rules=true
